# Applies to both halves. Left-only options (ZMK Studio, right-half battery
# reporting) are in build.yaml.

# Mouse keys on Miryoku's Mouse and Button layers
CONFIG_ZMK_POINTING=y

# On battery, power off after 30 minutes without a key press. Any key wakes it
# up again (that key press itself is not typed). Never sleeps on USB power.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
